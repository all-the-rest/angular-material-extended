packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  canvas: true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true

overrides:
  axios: '>=1.18.0'
  webpack-dev-server: '>=5.2.6'
  http-proxy-middleware: '>=3.0.7'
  js-yaml: '4.3.1'
  brace-expansion: '5.0.9'
  fast-uri: '3.1.5'
  ip-address: '10.3.1'
  postcss: '8.5.23'
  tar: '7.5.21'
  undici: '6.28.0'
  '@angular/platform-server': '22.0.7'
  '@hono/node-server': '>=2.0.5'
  hono: '4.12.34'
  nanoid: '3.3.17'
  '@babel/core': '>=7.29.6'
  qs: '>=6.15.2'
  uuid: '>=11.1.1'
  esbuild: '>=0.28.1'
