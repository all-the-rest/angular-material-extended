name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
      - run: pnpm install
      - run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - run: pnpm nx build mat-extended
      - run: pnpm nx test mat-extended
      - run: pnpm nx lint mat-extended
      - run: pnpm nx build demo
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm nx e2e demo-e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/demo-e2e/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  publish:
    needs: [test-and-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - name: Publish to npm
        run: |
          cd packages/mat-extended
          npm publish --provenance --access public
      - name: Extract changelog for this release
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # Extract the section for this version from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            BODY=$(awk -v ver="\\[${VERSION}\\]" '
              $0 ~ ver { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md | sed '/^$/d' | sed 's/^/  /' | sed 's/  - /- /' | sed 's/  ### /### /' | sed 's/  ###/###/' | sed 's/^  //')
            if [ -n "$BODY" ]; then
              echo "body<<EOF" >> $GITHUB_OUTPUT
              echo "$BODY" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        if: steps.changelog.outputs.body != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.changelog.outputs.tag }}" \
            --title "Release ${{ steps.changelog.outputs.tag }}" \
            --notes "${{ steps.changelog.outputs.body }}" \
            --repo "${{ github.repository }}"
