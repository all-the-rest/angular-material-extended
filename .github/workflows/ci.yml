name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm nx test mat-extended --parallel=4
      - run: pnpm nx lint mat-extended
      - run: pnpm nx build mat-extended

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm nx build mat-extended
      - run: pnpm nx build demo
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E tests
        id: e2e
        run: pnpm exec playwright test --config=apps/demo-e2e/playwright.config.ts
        continue-on-error: true
      - name: Write e2e job summary
        if: always()
        run: node .github/scripts/playwright-summary.mjs
        env:
          REPORT_FILE: apps/demo-e2e/e2e-results.json
      - name: Fail job on e2e failures
        if: steps.e2e.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/demo-e2e/playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: demo-dist
          path: dist/apps/demo/browser
          retention-days: 1

  deploy-demo:
    if: github.ref == 'refs/heads/main'
    needs: [test-and-lint, e2e]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: demo-dist
          path: dist/apps/demo/browser
      - uses: actions/configure-pages@v6
        id: configure-pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/apps/demo/browser
      - uses: actions/deploy-pages@v5
        id: deployment
